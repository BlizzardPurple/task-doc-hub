[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-doc-hub"
version = "0.1.0"
description = "A local MCP server for persistent, cross-workspace task documentation management"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[project.scripts]
task-doc-hub = "task_doc_hub.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/task_doc_hub"]
